<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const savedTheme = localStorage.getItem("indicator_alert_theme");
        if (savedTheme === "light" || savedTheme === "dark") document.documentElement.dataset.theme = savedTheme;
      } catch { /* Mặc định dark khi trình duyệt chặn lưu trữ. */ }
      try {
        const savedLanguage = localStorage.getItem("indicator_alert_language");
        if (savedLanguage === "vi") document.documentElement.lang = "vi";
      } catch { /* English is the default when storage is unavailable. */ }
    </script>
    <meta
      name="description"
      content="Create and manage technical indicator alert rules (SMA, EMA, RSI) for Binance market data."
    />
    <title>Indicator Alert – Binance indicator alerts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
