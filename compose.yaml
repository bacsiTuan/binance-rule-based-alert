services:
  api:
    build: ./BE
    ports:
      - "0.0.0.0:${API_PORT:-8000}:8000"
    # Lets host.docker.internal resolve on Linux (built in on Docker Desktop).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Inside Docker, Redis is reached by its service name, not localhost.
      REDIS_URL: redis://:${REDIS_PASSWORD:-randompasword}@redis:6379/0
      BINANCE_MARKET: ${BINANCE_MARKET:-spot}
      BINANCE_BASE_URL: ${BINANCE_BASE_URL:-}
      BINANCE_TIMEOUT_SECONDS: ${BINANCE_TIMEOUT_SECONDS:-10}
      BINANCE_MAX_ATTEMPTS: ${BINANCE_MAX_ATTEMPTS:-3}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      STALE_TTL_SECONDS: ${STALE_TTL_SECONDS:-3600}
      SYMBOLS_TTL_SECONDS: ${SYMBOLS_TTL_SECONDS:-3600}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_TIMEOUT_SECONDS: ${TELEGRAM_TIMEOUT_SECONDS:-10}
      TELEGRAM_TIMEZONE: ${TELEGRAM_TIMEZONE:-Asia/Ho_Chi_Minh}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-60}
      AI_ENABLED: ${AI_ENABLED:-true}
      TELEGRAM_AI_ENABLED: ${TELEGRAM_AI_ENABLED:-true}
      TELEGRAM_AI_LANGUAGE: ${TELEGRAM_AI_LANGUAGE:-vi}
      TELEGRAM_AI_TIMEOUT_SECONDS: ${TELEGRAM_AI_TIMEOUT_SECONDS:-8}
      AI_CHAT_REQUESTS_PER_MINUTE: ${AI_CHAT_REQUESTS_PER_MINUTE:-6}
      TELEGRAM_TEST_ENABLED: ${TELEGRAM_TEST_ENABLED:-false}
      TELEGRAM_TEST_KEY: ${TELEGRAM_TEST_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    ports:
      - "0.0.0.0:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-randompasword}"]
    volumes:
      - redis_data:/data
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-randompasword}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis_data:
